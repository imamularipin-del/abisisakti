#pwa.show{opacity:1;transform:translate(-50%,0)}

main.lg{display:flex;flex-direction:column;padding-bottom:16px}

<body>

<script>
var COL={H:'#12b886',I:'#3b82f6',S:'#f59e0b',A:'#ef4444'},LBL={H:'Hadir',I:'Izin',S:'Sakit',A:'Alpa'};
var PAL=['#6c4cf5','#ff5fa2','#12b886','#3b82f6','#f59e0b','#ef4444','#8b5cf6','#06b6d4'];
var hk='ALL';var KEY='absensi-siswa-v1',D,tab='home',sess=null,cur={kelas:null,tgl:null,mark:{}},rk={kelas:'',bulan:''};
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
D={guru:'',kelas:[],siswa:[],absen:{},he:{},set:{}};
var API_URL='https://script.google.com/macros/s/AKfycbykXoU7ggOY9_0lhFDGLjhVFYX8bt9wIzEwRbOLCxiFpP8BPRH9-odbn-K77ukxaHGfEg/exec';
function api(fn){
  var a=[].slice.call(arguments,1);
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:a})})
    .catch(function(){throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet Anda.')})
    .then(function(r){return r.json()})
    .then(function(j){if(!j||!j.ok)throw new Error((j&&j.error)||'Server tidak merespons.');return j.data})
}
function err(e){var m=String(e&&e.message||e);if(/Sesi berakhir/.test(m)){sess=null;lsDel();render()}Swal.fire({icon:'error',title:'Terjadi kesalahan',text:m,confirmButtonColor:'#6c4cf5'})}
function wait(t){Swal.fire({title:t,allowOutsideClick:false,showConfirmButton:false,didOpen:function(){Swal.showLoading()}})}
var T=Swal.mixin({toast:true,position:'top',showConfirmButton:false,timer:2200,timerProgressBar:true});
function ini(n){return n.split(' ').map(function(x){return x[0]}).slice(0,2).join('')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function bulanList(){var s={};Object.keys(D.absen).forEach(function(k){s[k.slice(0,7)]=1});s[today().slice(0,7)]=1;return Object.keys(s).sort().reverse()}
function bln(b){var p=b.split('-');return['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][+p[1]-1]+' '+p[0]}
function hitung(kelas,bulan){
  var out=[];D.siswa.filter(function(s){return !kelas||s.kelas==kelas}).forEach(function(s){
    var c={H:0,I:0,S:0,A:0};
    Object.keys(D.absen).forEach(function(k){var p=k.split('|');if(+p[1]==s.id&&(!bulan||p[0].slice(0,7)==bulan)&&heInfo(p[0]).st!='T')c[D.absen[k]]++});
    var tot=c.H+c.I+c.S+c.A;out.push({s:s,c:c,tot:tot,pct:tot?Math.round(c.H/tot*100):0})});
  return out}
function opt(arr,sel,all){return (all?'<option value="">'+all+'</option>':'')+arr.map(function(a){return '<option value="'+a+'"'+(a==sel?' selected':'')+'>'+(all===undefined?a:esc(a))+'</option>'}).join('')}

function render(){render0();sekBadge()}
function render0(){
  var v=document.getElementById('v');
  v.className=sess?'':'lg';
  if(!sess){v.innerHTML=loginV();document.getElementById('nav').style.display='none';return}
  document.getElementById('nav').style.display='flex';
  v.innerHTML={home:homeV,absen:absenV,rekap:rekapV,siswa:siswaV,he:heV}[tab]();
  var items=[['home','🏠','Beranda'],['absen','✅','Absen'],['rekap','📊','Rekap'],['siswa','👩‍🎓','Siswa']];
  if(sess.admin)items.push(['he','⚙️','Admin']);document.getElementById('nav').innerHTML=items.map(function(x){return '<button class="'+(tab==x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join('');
}
function go(t){tab=t;render();document.getElementById('v').scrollTop=0;if(t=='absen'&&heInfo(cur.tgl).st=='T')T.fire({icon:'info',title:'Hari Tidak Efektif (HTE)'})}

var TK='absensi-token';
function lsGet(){try{return localStorage.getItem(TK)}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(TK,v)}catch(e){}}
function lsDel(){try{localStorage.removeItem(TK)}catch(e){}}
var AK='absensi-akun',SKK='absensi-sekolah',SK='';try{SK=localStorage.getItem(SKK)||''}catch(e){}
function akunList(){try{return JSON.parse(localStorage.getItem(AK))||[]}catch(e){return[]}}
function akunSave(l){try{localStorage.setItem(AK,JSON.stringify(l.slice(0,5)))}catch(e){}}
function akunSet(id,nama){var l=akunList().filter(function(a){return a.id!=id});l.unshift({id:id,nama:nama});akunSave(l)}
function akunDel(id){akunSave(akunList().filter(function(a){return a.id!=id}))}
function skSet(n){SK=n||'';try{localStorage.setItem(SKK,SK)}catch(e){}}
function skName(){return (D.set&&D.set.Sekolah)||SK||''}
function sekBadge(){var h=document.querySelector('#v .hero'),n=skName();if(!h||!n)return;var e=h.querySelector('.sk');if(e){e.textContent=n;return}e=document.createElement('div');e.className='sk';e.textContent=n;h.insertBefore(e,h.firstChild)}
function muatSekolah(){api('infoSekolah').then(function(n){skSet(n);if(!sess)sekBadge()}).catch(function(){})}
var EYE='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',
EYEOFF='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
function lihatPin(){var i=document.getElementById('gp'),b=document.getElementById('ge'),s=i.type=='password';i.type=s?'text':'password';b.innerHTML=s?EYEOFF:EYE;b.setAttribute('aria-label',s?'Sembunyikan PIN':'Tampilkan PIN')}
function pilihAkun(i){var a=akunList()[i];if(!a)return;document.getElementById('gn').value=a.id;document.getElementById('gp').focus()}
function hapusAkun(i){var a=akunList()[i];if(!a)return;akunDel(a.id);render();T.fire({icon:'info',title:'Akun dihapus dari browser'})}

function donut(v,total,pct){
  var R=42,C=2*Math.PI*R,off=0,seg='',cols={H:COL.H,I:COL.I,S:COL.S,A:COL.A,B:'var(--line)'};
  ['H','I','S','A','B'].forEach(function(k){var n=v[k]||0;if(!n||!total)return;var len=n/total*C;
    seg+='<circle cx="55" cy="55" r="'+R+'" fill="none" style="stroke:'+cols[k]+'" stroke-width="14" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'"/>';off+=len});
  return '<div class="dn"><svg viewBox="0 0 110 110" role="img" aria-label="Kehadiran hari ini '+pct+' persen"><circle cx="55" cy="55" r="'+R+'" fill="none" style="stroke:var(--line)" stroke-width="14"/>'+seg+'</svg><div class="c"><b>'+pct+'%</b><small>hadir</small></div></div>'
}
function igData(sis){
  var ok={},bl=today().slice(0,7),st={},tgl={},mon={H:0,I:0,S:0,A:0};
  sis.forEach(function(s){ok[s.id]=1});
  Object.keys(D.absen).forEach(function(k){
    var p=k.split('|'),d=p[0],v=D.absen[k];
    if(!ok[p[1]]||heInfo(d).st=='T'||!(v in mon))return;
    var a=st[p[1]]||(st[p[1]]={all:{H:0,I:0,S:0,A:0},bln:{H:0,I:0,S:0,A:0}});
    a.all[v]++;
    if(d.slice(0,7)==bl){a.bln[v]++;mon[v]++}
    var x=tgl[d]||(tgl[d]={H:0,I:0,S:0,A:0});x[v]++
  });
  return{sis:sis,st:st,tgl:tgl,mon:mon,bl:bl}
}

</script>
<div id="pwa" role="dialog" aria-label="Pasang aplikasi"><div class="ph"><img class="pi" src="/icons/icon-192.png" alt="" width="52" height="52"><div class="pb"><b>Pasang Abisisakti</b><span id="pwat"></span></div></div><div class="pa"><button class="x" id="pwax">Nanti saja</button><button class="go" id="pwago">📲 Pasang sekarang</button></div></div>
<script>
(function(){
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})})}
  var box=document.getElementById('pwa'),txt=document.getElementById('pwat'),go=document.getElementById('pwago'),x=document.getElementById('pwax'),ev=null,KEY='abisisakti-pwa-tutup';
  function standalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
  function ditutup(){try{return localStorage.getItem(KEY)==='1'}catch(e){return false}}
  function buka(){box.style.display='flex';setTimeout(function(){box.classList.add('show')},60)}
  function sembunyi(){box.classList.remove('show');setTimeout(function(){box.style.display='none'},400)}
  function tutup(){sembunyi();try{localStorage.setItem(KEY,'1')}catch(e){}}
  x.onclick=tutup;
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();ev=e;if(standalone()||ditutup())return;
    txt.textContent='Buka lebih cepat dari layar utama, tampil layar penuh seperti aplikasi biasa.';go.style.display='';x.textContent='Nanti saja';buka()});
  go.onclick=function(){if(!ev)return;sembunyi();ev.prompt();ev.userChoice.finally(function(){ev=null})};
  window.addEventListener('appinstalled',sembunyi);
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
  if(ios&&!standalone()&&!ditutup()){
    txt.innerHTML='Ketuk <i>⎙</i> Bagikan, lalu pilih <i>＋</i> <b style="display:inline;font-size:inherit">Tambah ke Layar Utama</b>.';go.style.display='none';x.textContent='Mengerti';buka()}
})();
</script>
